name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # Spec §9: replays the committed recordings (no API keys, no Ollama) and fails on unsafe
  # actions, stale recordings, or any score more than 2 points below baseline.json.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:ci
      # The whole suite, replayed offline, against the M9 targets (packages/evals/targets.json).
      - run: pnpm eval:targets

  infra:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://frontdesk:frontdesk@localhost:5432/frontdesk
      EVAL_DATABASE_URL: postgres://frontdesk:frontdesk@localhost:5432/frontdesk_eval
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk
          POSTGRES_DB: frontdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontdesk -d frontdesk"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service containers can't mount docker/postgres/init, so create the eval DB here.
      - run: psql "$DATABASE_URL" -f docker/postgres/init/01-create-eval-db.sql
      - run: pnpm test:infra

  # Spec §13: Playwright against web + api with the scripted LLM and an in-memory calendar.
  # No API keys; Postgres and Redis run as services, like `infra`.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://frontdesk:frontdesk@localhost:5432/frontdesk
      EVAL_DATABASE_URL: postgres://frontdesk:frontdesk@localhost:5432/frontdesk_eval
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk
          POSTGRES_DB: frontdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontdesk -d frontdesk"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql "$DATABASE_URL" -f docker/postgres/init/01-create-eval-db.sql
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
